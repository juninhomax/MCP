version: '3.8'

services:
  brain:
    build:
      context: .
      dockerfile: Dockerfile.brain
    container_name: mcp-brain
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=ollama
      - LLM_MODEL=qwen2.5-coder:14b
      - LLM_API_BASE=http://ollama:11434
      - BRAIN_HOST=0.0.0.0
      - BRAIN_PORT=8000
      - ENABLE_AUDIT=true
    depends_on:
      - ollama
    networks:
      - mcp-network
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: mcp-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - mcp-network
    restart: unless-stopped

  linux-slave:
    build:
      context: .
      dockerfile: Dockerfile.linux
    container_name: mcp-linux-slave
    ports:
      - "8001:8001"
    environment:
      - SLAVE_ID=linux-slave-01
      - SLAVE_TYPE=linux
      - HOST=0.0.0.0
      - PORT=8001
      - BRAIN_ENDPOINT=http://brain:8000
      - AUTH_TOKEN=${LINUX_SLAVE_TOKEN}
    networks:
      - mcp-network
    restart: unless-stopped

networks:
  mcp-network:
    driver: bridge

volumes:
  ollama-data:
